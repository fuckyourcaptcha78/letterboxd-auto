name: Letterboxd Auto Post

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

jobs:
  post-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest review
        run: |
          curl -s https://letterboxd.com/YOURUSERNAME/rss/ > feed.xml
          
          TITLE=$(grep -o '<title>.*</title>' feed.xml | head -n 2 | tail -n 1 | sed 's/<[^>]*>//g')
          LINK=$(grep -o '<link>.*</link>' feed.xml | head -n 2 | tail -n 1 | sed 's/<[^>]*>//g')

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "LINK=$LINK" >> $GITHUB_ENV

      - name: Check last post
        id: check
        run: |
          if [ -f last_post.txt ]; then
            LAST=$(cat last_post.txt)
          else
            LAST=""
          fi

          if [ "$LAST" = "$LINK" ]; then
            echo "No new review"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "New review found"
            echo "$LINK" > last_post.txt
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Install jq
  run: sudo apt-get install -y jq

- name: Post to Bluesky
  if: steps.check.outputs.skip == 'false'
  run: |
    TEXT="Watched $TITLE — thoughts are up: $LINK"

    curl -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
      -H "Content-Type: application/json" \
      -d "{\"identifier\":\"$BSKY_USER\",\"password\":\"$BSKY_PASS\"}" \
      > session.json

    ACCESS=$(jq -r '.accessJwt' session.json)

    curl -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord \
      -H "Authorization: Bearer $ACCESS" \
      -H "Content-Type: application/json" \
      -d "{
        \"repo\": \"$BSKY_USER\",
        \"collection\": \"app.bsky.feed.post\",
        \"record\": {
          \"text\": \"$TEXT\",
          \"createdAt\": \"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"
        }
      }"
