name: Letterboxd Auto Post

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  post-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Get latest review
        run: |
          curl -s https://letterboxd.com/readjunk/rss/ > feed.xml
          
          TITLE=$(grep -o '<title>.*</title>' feed.xml | head -n 2 | tail -n 1 | sed 's/<[^>]*>//g')
          LINK=$(grep -o '<link>.*</link>' feed.xml | head -n 2 | tail -n 1 | sed 's/<[^>]*>//g')

          echo "TITLE=$TITLE" >> $GITHUB_ENV
          echo "LINK=$LINK" >> $GITHUB_ENV

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

           - name: Post to Bluesky
        run: |
          echo "TITLE: $TITLE"
          echo "LINK: $LINK"

          TEXT="Watched $TITLE - $LINK"

          echo "Logging in..."

          SESSION=$(curl -s -X POST https://bsky.social/xrpc/com.atproto.server.createSession \
            -H "Content-Type: application/json" \
            -d "{\"identifier\":\"$BSKY_USER\",\"password\":\"$BSKY_PASS\"}")

          echo "Session:"
          echo $SESSION

          ACCESS=$(echo "$SESSION" | jq -r '.accessJwt')

          echo "Access token:"
          echo $ACCESS

          echo "Posting..."

          RESPONSE=$(curl -s -X POST https://bsky.social/xrpc/com.atproto.repo.createRecord \
            -H "Authorization: Bearer $ACCESS" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"$BSKY_USER\",\"collection\":\"app.bsky.feed.post\",\"record\":{\"text\":\"$TEXT\",\"createdAt\":\"$(date -u +"%Y-%m-%dT%H:%M:%SZ")\"}}")

          echo "Response:"
          echo $RESPONSE
